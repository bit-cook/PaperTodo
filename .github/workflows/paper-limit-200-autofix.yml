name: Paper limit 200 autofix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/paper-limit-200'
    runs-on: windows-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Raise paper limit and update user-facing text
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              with p.open('r', encoding='utf-8', newline='') as f:
                  text = f.read()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
              with p.open('w', encoding='utf-8', newline='') as f:
                  f.write(text)

          replace_once('src/AppController.cs',
                       'if (State.Papers.Count >= 100)',
                       'if (State.Papers.Count >= 200)')
          replace_once('src/PaperCommandService.cs',
                       'if (_controller.State.Papers.Count >= 100)',
                       'if (_controller.State.Papers.Count >= 200)')
          replace_once('Resources/Strings.resx',
                       '纸片已达到 100 张上限。',
                       '纸片已达到 200 张上限。')
          replace_once('Resources/Strings.en.resx',
                       'You have reached the 100-paper limit.',
                       'You have reached the 200-paper limit.')
          replace_once('Resources/Strings.ja.resx',
                       '紙片の数が上限の 100 枚に達しました。',
                       '紙片の数が上限の 200 枚に達しました。')
          replace_once('Resources/Strings.ko.resx',
                       '종이 수가 최대 100장에 도달했습니다.',
                       '종이 수가 최대 200장에 도달했습니다.')

          def insert_after(path: str, heading: str, line: str) -> None:
              p = Path(path)
              with p.open('r', encoding='utf-8', newline='') as f:
                  text = f.read()
              eol = '\r\n' if '\r\n' in text else '\n'
              anchor = heading + eol + eol
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected exactly one changelog anchor {heading!r}')
              if line in text:
                  raise SystemExit(f'{path}: changelog line already present')
              text = text.replace(anchor, anchor + line + eol, 1)
              with p.open('w', encoding='utf-8', newline='') as f:
                  f.write(text)

          insert_after(
              'CHANGELOG.md',
              '### Unreleased',
              '- **纸片数量上限**：纸片总数上限从 100 张提高到 200 张；达到上限时仍使用应用内提示提醒清理。')
          insert_after(
              'doc/CHANGELOG.en.md',
              '### Unreleased (4.0.0-preview)',
              '- **Paper Count Limit**: Raised the total paper limit from 100 to 200; the in-app cleanup prompt still appears when the limit is reached.')

      - name: Verify patch shape
        shell: pwsh
        run: |
          git diff --check
          git diff -- src/AppController.cs src/PaperCommandService.cs Resources/Strings.resx Resources/Strings.en.resx Resources/Strings.ja.resx Resources/Strings.ko.resx CHANGELOG.md doc/CHANGELOG.en.md

          $diff = git diff --numstat
          if (-not $diff) { throw 'Expected source changes, but git diff is empty.' }

      - name: Commit clean PR contents
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/paper-limit-200-autofix.yml
          git add src/AppController.cs src/PaperCommandService.cs Resources/Strings.resx Resources/Strings.en.resx Resources/Strings.ja.resx Resources/Strings.ko.resx CHANGELOG.md doc/CHANGELOG.en.md
          git commit -m "feat: raise paper limit to 200 [ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Build final source
        shell: pwsh
        run: dotnet build PaperTodo.csproj -c Release --nologo

      - name: Dispatch standard PR build on final head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{ ref = $env:HEAD_REF } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/pull-request-build.yml/dispatches" -Headers $headers -ContentType "application/json" -Body $body
