name: One-shot PR268 reconcile

on:
  push:
    branches:
      - work/settings-markdown-preview-direction-20260915

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/settings-markdown-preview-direction-20260915
          fetch-depth: 0
      - name: Reconcile with latest main
        run: python .github/scripts/reconcile_pr268_v3.py
