name: One-shot PR268 reconcile

on:
  push:
    branches:
      - work/settings-markdown-preview-direction-20260915

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/settings-markdown-preview-direction-20260915
          fetch-depth: 0

      - name: Merge latest main and reapply final PR behavior
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          import re

          def run(*args):
              subprocess.run(args, check=True)

          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('git', 'fetch', 'origin', 'main')
          run('git', 'merge', 'origin/main', '-X', 'theirs', '--no-edit')

          # For files touched by recent main settings/docs work, start from main and apply only this PR's final behavior.
          authoritative = [
              'src/AppController.Settings.GeneralPage.cs',
              'src/AppController.Settings.NotePage.cs',
              'src/Models.cs',
              'CHANGELOG.md',
              'doc/CHANGELOG.en.md',
              'doc/USER_GUIDE.md',
              'doc/USER_GUIDE.en.md',
              'Resources/Strings.resx',
              'Resources/Strings.en.resx',
              'Resources/Strings.ja.resx',
              'Resources/Strings.ko.resx',
          ]
          run('git', 'checkout', 'origin/main', '--', *authoritative)

          # Runtime/tests: former Enhanced behavior is now Basic; no Enhanced runtime symbol remains.
          for root in ('src', 'tests'):
              for path in Path(root).rglob('*.cs'):
                  if path.as_posix() == 'src/Models.cs':
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  text = text.replace('MarkdownRenderModes.Enhanced', 'MarkdownRenderModes.Basic')
                  # Collapse adjacent duplicate mode entries created by the rename.
                  text = re.sub(
                      r'(?m)^(\s*)MarkdownRenderModes\.Basic,\s*\n\1MarkdownRenderModes\.Basic,?\s*$',
                      r'\1MarkdownRenderModes.Basic,',
                      text)
                  text = re.sub(
                      r'MarkdownRenderModes\.Basic,\s*MarkdownRenderModes\.Basic',
                      'MarkdownRenderModes.Basic',
                      text)
                  if text != original:
                      path.write_text(text, encoding='utf-8')

          # Models: exactly three runtime modes; "enhanced" survives only as an old serialized token.
          models = Path('src/Models.cs')
          text = models.read_text(encoding='utf-8')
          text = re.sub(
              r'public static class MarkdownRenderModes\n\{.*?\n\}\n\npublic static class ImageReferenceTextModes',
              '''public static class MarkdownRenderModes
{
    public const string Off = "off";
    public const string Basic = "basic";
    public const string Full = "full";

    // Old builds persisted "enhanced" as a separate mode. Keep only the wire token for migration.
    private const string LegacyEnhanced = "enhanced";

    public static bool IsValid(string? mode)
    {
        return mode is Off or Basic or Full;
    }

    public static string Normalize(string? mode) => mode switch
    {
        Off => Off,
        Basic or LegacyEnhanced => Basic,
        Full => Full,
        _ => Basic
    };
}

public static class ImageReferenceTextModes''',
              text,
              flags=re.S)
          text = text.replace(
              '    public string MarkdownRenderMode { get; set; } = MarkdownRenderModes.Enhanced;',
              '''    private string _markdownRenderMode = MarkdownRenderModes.Basic;
    [System.Diagnostics.CodeAnalysis.AllowNull]
    public string MarkdownRenderMode
    {
        get => _markdownRenderMode;
        set => _markdownRenderMode = MarkdownRenderModes.Normalize(value);
    }''')
          if 'public bool EdgeCapsulePreviewPreferDownward' not in text:
              text = text.replace(
                  '    public bool ExperimentalEdgeCapsuleHoverPreview { get; set; } = true;\n',
                  '    public bool ExperimentalEdgeCapsuleHoverPreview { get; set; } = true;\n'
                  '    public bool EdgeCapsulePreviewPreferDownward { get; set; } = true;\n')
          models.write_text(text, encoding='utf-8')

          # Settings > Note: three options, and Basic is the default (old Enhanced default, renamed).
          note = Path('src/AppController.Settings.NotePage.cs')
          text = note.read_text(encoding='utf-8')
          text = re.sub(
              r'^\s*\(MarkdownRenderModes\.Enhanced, Strings\.Get\("MarkdownRenderEnhanced"\)\),\n',
              '', text, flags=re.M)
          text = text.replace('State.MarkdownRenderMode = MarkdownRenderModes.Enhanced;',
                              'State.MarkdownRenderMode = MarkdownRenderModes.Basic;')
          note.write_text(text, encoding='utf-8')

          # Settings > General: add the #199 policy switch on top of main's latest settings layout.
          general = Path('src/AppController.Settings.GeneralPage.cs')
          text = general.read_text(encoding='utf-8')
          if 'EdgeCapsulePreviewPreferDownward' not in text:
              anchor = '''        rightColumn.Children.Add(WrapWithHint(
            _settingsCollapseExpandedDeepCapsuleOnClickCheckBox,
            "TipCollapseExpandedDeepCapsuleOnClick"));
'''
              block = anchor + '''        rightColumn.Children.Add(WrapWithHint(
            SettingsToggle(
                SettingsSidebarLocalized(
                    "浏览时优先向下展开",
                    "Prefer downward expansion while browsing",
                    "閲覧時は下方向への展開を優先",
                    "탐색 중 아래로 펼치기 우선"),
                State.EdgeCapsulePreviewPreferDownward,
                ToggleEdgeCapsulePreviewPreferDownward),
            BuildSettingsHintTooltip(SettingsSidebarLocalized(
                "默认开启。向下浏览边缘胶囊时，如果当前卡片下方空间足够，就保持鼠标处的位置并向下展开；空间不足时仍使用原有补位。关闭后始终优先利用上一张卡片释放的上方空位。",
                "Enabled by default. When browsing edge capsules downward, keep the hovered card in place and expand downward if it fits. Otherwise use the original placement. Disable to always reuse the upper space released by the previous card.",
                "初期設定はオンです。エッジカプセルを下方向に閲覧する際、カードが収まる場合はマウス位置を保って下に展開し、収まらない場合は従来の配置を使います。オフにすると前のカードが空けた上側の空間を常に優先します。",
                "기본으로 켜져 있습니다. 가장자리 캡슐을 아래로 탐색할 때 카드가 들어갈 공간이 있으면 마우스 위치를 유지하며 아래로 펼칩니다. 공간이 부족하면 기존 배치를 사용합니다. 끄면 이전 카드가 비운 위쪽 공간을 항상 우선 사용합니다."))));
'''
              if anchor not in text:
                  raise SystemExit('General settings insertion anchor changed')
              text = text.replace(anchor, block, 1)
              method_anchor = '    private string HideEdgeCapsuleCloseButtonOnHoverTip() =>\n'
              method = '''    private void ToggleEdgeCapsulePreviewPreferDownward()
    {
        State.EdgeCapsulePreviewPreferDownward = !State.EdgeCapsulePreviewPreferDownward;
        SaveNow();
    }

'''
              if method_anchor not in text:
                  raise SystemExit('General settings method anchor changed')
              text = text.replace(method_anchor, method + method_anchor, 1)
              default_anchor = '        State.CollapseExpandedDeepCapsuleOnClick = false;\n'
              text = text.replace(default_anchor,
                                  default_anchor + '        State.EdgeCapsulePreviewPreferDownward = true;\n', 1)
          general.write_text(text, encoding='utf-8')

          # #199 policy gate: false deliberately falls through to the old upper-space branch.
          placement = Path('src/AppController.EdgeCapsulePreviewPlacement.cs')
          text = placement.read_text(encoding='utf-8')
          if '!State.EdgeCapsulePreviewPreferDownward' not in text:
              text = text.replace(
                  '        if (!double.IsFinite(previewHeightDip) ||\n',
                  '        // Returning false uses the existing pre-#199 upper-space placement branch.\n'
                  '        if (!State.EdgeCapsulePreviewPreferDownward ||\n'
                  '            !double.IsFinite(previewHeightDip) ||\n', 1)
          placement.write_text(text, encoding='utf-8')

          # Localized resources: remove the obsolete Enhanced label and make Basic describe old Enhanced.
          resource_values = {
              'Resources/Strings.resx': '基础：保留 Markdown 标记，淡化语法标记，并显示列表圆点、分割线等轻量排版。\n完全渲染：编辑时也按标题、列表、引用、代码块等最终排版显示，隐藏多数 Markdown 标记；光标所在块显示其标记以便编辑。失焦后进入整篇只读渲染。',
              'Resources/Strings.en.resx': 'Basic: keeps Markdown markers, fades syntax, and shows lightweight layout such as list bullets and dividers.\nFull Render: while editing, headings, lists, quotes, code and other blocks use their final layout with most Markdown markers hidden; the block under the caret reveals its markers for editing. Blur switches to read-only whole-note rendering.',
              'Resources/Strings.ja.resx': '基本：Markdown 記号を残しつつ構文記号を薄くし、リストの丸印や区切り線などの軽い整形を表示します。\nフル レンダリング：編集中も見出し・リスト・引用・コードなどを最終レイアウトで表示し、大半の Markdown 記号を隠します。カーソルのあるブロックでは編集用に記号を表示し、フォーカスが外れると全体を読み取り専用で表示します。',
              'Resources/Strings.ko.resx': '기본: Markdown 기호를 유지하면서 문법 기호를 흐리게 하고 목록 점과 구분선 같은 가벼운 서식을 표시합니다.\n완전 렌더링: 편집 중에도 제목·목록·인용·코드 등을 최종 레이아웃으로 표시하고 대부분의 Markdown 기호를 숨깁니다. 커서가 있는 블록은 편집을 위해 기호를 표시하며, 포커스를 잃으면 전체 노트를 읽기 전용으로 렌더링합니다.',
          }
          for name, value in resource_values.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'\n  <data name="MarkdownRenderEnhanced" xml:space="preserve">\s*<value>.*?</value>\s*</data>',
                  '', text, flags=re.S)
              text, count = re.subn(
                  r'(<data name="TipMarkdownRender" xml:space="preserve">\s*<value>).*?(</value>)',
                  lambda m: m.group(1) + value + m.group(2),
                  text, flags=re.S)
              if count != 1:
                  raise SystemExit(f'TipMarkdownRender not uniquely found in {name}')
              path.write_text(text, encoding='utf-8')

          # Chinese release notes: describe the final behavior, not the intermediate implementation.
          zh = Path('CHANGELOG.md')
          text = zh.read_text(encoding='utf-8')
          text = text.replace(
              '关闭时显示原文，基础提供轻量高亮，增强淡化语法并显示列表圆点、分割线，编号和任务状态保持清晰，完全渲染隐藏语法标记；',
              '关闭时显示原文，基础采用原增强效果：保留标记、淡化语法并显示列表圆点和分割线，编号与任务状态保持清晰；完全渲染进一步隐藏语法标记；')
          text = text.replace(
              '向下切换时，只要目标卡片仍能完整显示，就优先保持当前鼠标附近的展开位置，不会为了填补上方空位突然跳动；',
              '默认向下切换时，只要目标卡片仍能完整显示，就优先保持当前鼠标附近的展开位置，不会为了填补上方空位突然跳动；常规设置可关闭「浏览时优先向下展开」，恢复优先利用上方空位的原补位规则；')
          text = text.replace(
              '- **完全渲染升级为所见即所得块级编辑**：笔记选择「完全渲染」档，',
              '- **完全渲染升级为所见即所得块级编辑**：Markdown 显示简化为「关闭 / 基础 / 完全渲染」；旧基础与旧增强统一为新的基础，其中基础采用旧增强效果；完全渲染保持不变，旧配置自动迁移，新安装及恢复默认选择基础。笔记选择「完全渲染」档，')
          text = text.replace('待办连续多选與批量操作', '待办连续多选与批量操作')
          zh.write_text(text, encoding='utf-8')

          # English release notes mirror the same final user-facing behavior.
          en = Path('doc/CHANGELOG.en.md')
          text = en.read_text(encoding='utf-8')
          text = text.replace(
              'Off shows source, Basic adds lightweight highlighting, Enhanced fades syntax and renders bullets and rules while keeping numbers and task markers readable, and Full shows compact formatting.',
              'Off shows source, Basic now uses the former Enhanced presentation—keeping markers while fading syntax and rendering bullets and rules, with numbers and task markers kept readable—and Full hides syntax markers for compact formatting.')
          text = text.replace(
              'When browsing downward, the next card stays near the current cursor whenever it can still fit on screen instead of jumping upward to fill free space;',
              'By default, when browsing downward, the next card stays near the current cursor whenever it can still fit on screen instead of jumping upward to fill free space; General settings can disable “Prefer downward expansion while browsing” to restore the original upper-space-first placement;')
          text = text.replace(
              '- **Full Render Is Now WYSIWYG Block Editing**: With “Full Render” selected,',
              '- **Full Render Is Now WYSIWYG Block Editing**: Markdown display is simplified to Off / Basic / Full Render. Legacy Basic and Enhanced settings migrate to the new Basic, whose visuals match the former Enhanced mode; Full Render remains Full Render, and new/restored defaults use Basic. With “Full Render” selected,')
          en.write_text(text, encoding='utf-8')

          # User guides in both languages.
          guide = Path('doc/USER_GUIDE.md')
          text = guide.read_text(encoding='utf-8')
          text = text.replace(
              '四档渲染强度（关闭纯文本 / 基础适度 / 增强渲染 / 完全渲染）；完全渲染模式下',
              '三档渲染强度（关闭纯文本 / 基础增强显示 / 完全渲染）；基础采用原增强档效果，保留 Markdown 标记并淡化语法、显示列表圆点与分割线；完全渲染模式下')
          guide.write_text(text, encoding='utf-8')

          guide = Path('doc/USER_GUIDE.en.md')
          text = guide.read_text(encoding='utf-8')
          text = text.replace(
              'Four levels (Plain text / Basic / Enhanced / Full Render). With **Full Render**,',
              'Three levels (Plain text / Basic / Full Render). **Basic** uses the former Enhanced presentation, keeping Markdown markers while fading syntax and showing bullets and dividers. With **Full Render**,')
          guide.write_text(text, encoding='utf-8')

          # Persisted state fallback also follows the new Basic default.
          state_store = Path('src/StateStore.cs')
          text = state_store.read_text(encoding='utf-8').replace(
              'state.MarkdownRenderMode = MarkdownRenderModes.Enhanced;',
              'state.MarkdownRenderMode = MarkdownRenderModes.Basic;')
          state_store.write_text(text, encoding='utf-8')

          # Strong final invariants.
          assert 'MarkdownRenderModes.Enhanced' not in '\n'.join(
              p.read_text(encoding='utf-8') for root in ('src', 'tests') for p in Path(root).rglob('*.cs'))
          assert 'private const string LegacyEnhanced = "enhanced";' in models.read_text(encoding='utf-8')
          assert 'Basic or LegacyEnhanced => Basic' in models.read_text(encoding='utf-8')
          assert 'EdgeCapsulePreviewPreferDownward { get; set; } = true;' in models.read_text(encoding='utf-8')
          assert '!State.EdgeCapsulePreviewPreferDownward' in placement.read_text(encoding='utf-8')
          for path in Path('Resources').glob('Strings*.resx'):
              assert 'MarkdownRenderEnhanced"' not in path.read_text(encoding='utf-8')

          run('git', 'diff', '--check')
          run('git', 'add', '-A')
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
              run('git', 'commit', '-m', 'refactor: 基于最新 main 收敛 Markdown 三档 [ci]')
          run('git', 'push', 'origin', 'HEAD:work/settings-markdown-preview-direction-20260915')
