name: Backfill English release notes

on:
  push:
    branches: [main]
    paths: [.github/release-notes-backfill.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-english-release-notes
  cancel-in-progress: false

jobs:
  update-notes:
    if: github.repository == 'snownico0722/PaperTodo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Check bilingual release note generation
        run: python -m unittest discover -s .github/scripts -p test_release_notes.py

      # One-time migration. Remove this workflow and its payload after verification.
      - name: Update existing release descriptions
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const { createHash } = require('node:crypto');
            const changes = JSON.parse(fs.readFileSync('.github/release-notes-backfill.json', 'utf8'));
            const hash = text => createHash('sha256').update(text, 'utf8').digest('hex');
            const repo = context.repo;
            const latest = (await github.rest.repos.getLatestRelease(repo)).data;
            const assetIds = release => release.assets.map(asset => asset.id).sort((a, b) => a - b);
            const metadata = release => JSON.stringify({
              tag: release.tag_name, name: release.name, target: release.target_commitish,
              draft: release.draft, prerelease: release.prerelease,
              published: release.published_at, assets: assetIds(release)
            });
            function validate(release, change) {
              if (release.id !== change.id || release.tag_name !== change.tag) {
                throw new Error(`Release identity changed: ${change.tag}`);
              }
              if (JSON.stringify(assetIds(release)) !== JSON.stringify(change.expectedAssetIds)) {
                throw new Error(`Release assets changed: ${change.tag}`);
              }
              if (release.body !== change.body && hash(release.body || '') !== change.expectedBodySha256) {
                throw new Error(`Release notes changed since preparation: ${change.tag}`);
              }
            }
            // Check the complete batch before the first write, then check each item again.
            for (const change of changes) {
              const release = (await github.rest.repos.getRelease({ ...repo, release_id: change.id })).data;
              validate(release, change);
            }
            // The existing latest release stays latest; process it last.
            changes.sort((a, b) => Number(a.id === latest.id) - Number(b.id === latest.id));
            for (const change of changes) {
              const before = (await github.rest.repos.getRelease({ ...repo, release_id: change.id })).data;
              validate(before, change);
              if (before.body === change.body) {
                core.info(`${change.tag}: already updated`);
                continue;
              }
              await github.rest.repos.updateRelease({
                ...repo, release_id: change.id, body: change.body,
                make_latest: change.id === latest.id ? 'true' : 'false'
              });
              const after = (await github.rest.repos.getRelease({ ...repo, release_id: change.id })).data;
              if (after.body !== change.body || metadata(after) !== metadata(before)) {
                throw new Error(`Post-update verification failed: ${change.tag}`);
              }
              core.info(`${change.tag}: English added, Chinese and downloads verified`);
            }
            const latestAfter = (await github.rest.repos.getLatestRelease(repo)).data;
            if (latestAfter.id !== latest.id) throw new Error('Latest release changed during migration.');
            await core.summary.addHeading('English release notes backfilled')
              .addList(changes.map(change => change.tag)).write();
