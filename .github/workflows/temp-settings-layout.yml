name: Apply settings layout refactor

on:
  push:
    branches:
      - agent/settings-language-dropdowns

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply exact settings replacements
        run: python scripts/temp-apply-settings-layout.py

      - name: Scope and diff guards
        shell: pwsh
        run: |
          git diff --check
          $changed = @(git diff --name-only)
          $allowed = @('AppController.Settings.cs','README.md','README.en.md')
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected patcher changes: $($unexpected -join ', ')"
          }
          if ($changed -match 'EdgeCapsule|PaperWindow\.EdgeCapsule') {
            throw 'Edge presentation files must not change.'
          }

      - name: Build
        run: dotnet build PaperTodo.csproj -c Release

      - name: Commit clean result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/temp-settings-layout.yml scripts/temp-apply-settings-layout.py
          if (Test-Path scripts/settings-layout-trigger.txt) {
            git rm -- scripts/settings-layout-trigger.txt
          }
          git add -- AppController.Settings.cs README.md README.en.md
          git diff --cached --check
          git commit -m "refactor: compact settings dropdown layout"
          git push origin HEAD:agent/settings-language-dropdowns
